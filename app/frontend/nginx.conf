# Web sloj: servira Angular statiku i reverse-proxyja /api na backend (app.ruo.lab:5000).
# Frontend zove isti origin (/api), pa nema CORS-a. Backend se adresira DNS imenom.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Projektni DNS za razrješavanje app.ruo.lab u run-time-u
    resolver 10.40.0.53 valid=30s;

    location /api/ {
        set $backend http://app.ruo.lab:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA routing — sve nepoznate putanje na index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
