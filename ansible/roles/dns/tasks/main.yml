---
# Rola dns — autoritativni BIND9 za zonu ruo.lab na ruo-dns.
# Zona je dinamička: servisne zapise dodaje Terraform preko TSIG ključa ruo-tf.

- name: Instaliraj BIND9
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-utils
      - bind9-dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: named.conf.options (recursion + forwarders)
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: reload bind

- name: named.conf.local (TSIG ključ + dinamička zona)
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0640"
  no_log: true
  notify: reload bind

- name: Inicijalni zonski fajl (samo ako ne postoji — čuva dinamičke zapise)
  ansible.builtin.template:
    src: db.zone.j2
    dest: "/var/lib/bind/db.{{ dns_zone }}"
    owner: bind
    group: bind
    mode: "0644"
    force: false

- name: Provjeri BIND konfiguraciju
  ansible.builtin.command: named-checkconf
  changed_when: false

- name: Provjeri zonski fajl
  ansible.builtin.command: "named-checkzone {{ dns_zone }} /var/lib/bind/db.{{ dns_zone }}"
  changed_when: false

- name: BIND servis uključen i pokrenut
  ansible.builtin.service:
    name: named
    enabled: true
    state: started
