---
# Rola docker — Docker Engine + Compose plugin na slojevima aplikacije (web, app, db)..
# Koristi Ubuntu pakete (docker.io, docker-compose-v2).

- name: Instaliraj Docker Engine i Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Docker servis uključen i pokrenut
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Dodaj korisnika 'student' u docker grupu
  ansible.builtin.user:
    name: student
    groups: docker
    append: true
